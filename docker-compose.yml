services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: indexa-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indexa}
      POSTGRES_DB: ${POSTGRES_DB:-indexa}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-indexa} -d ${POSTGRES_DB:-indexa}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: indexa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
